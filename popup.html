<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>乐仓原型</title>
    <style>
      body {
        margin: 0;
        min-width: 220px;
        padding: 16px;
        font-family: Arial, "Microsoft YaHei", sans-serif;
        background: #ffffff;
        color: #111827;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 16px;
      }

      button {
        width: 100%;
        height: 34px;
        border: 1px solid #1677ff;
        border-radius: 4px;
        background: #1677ff;
        color: #ffffff;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #0958d9;
        border-color: #0958d9;
      }

      button:disabled {
        cursor: default;
        opacity: 0.6;
      }

      p {
        min-height: 18px;
        margin: 10px 0 0;
        color: #64748b;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>乐仓原型</h1>
    <button id="refresh-page" type="button">重新加载插件并刷新页面</button>
    <p id="status" aria-live="polite"></p>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
